<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Danh sách sinh viên</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
      body {
        font-family: Arial;
        margin: 30px;
      }

      h1 {
        font-size: 42px;
      }

      input {
        width: 480px;
        padding: 18px;
        font-size: 20px;
        border: 2px solid #aaa;
        border-radius: 10px;
      }

      button {
        margin-top: 100px;
        margin-right: 15px;
        padding: 10px 20px;
        border: none;
        border-radius: 20px;
        font-size: 20px;
        color: #087cff;
      }

      #ketqua {
        margin-top: 60px;
        font-size: 24px;
      }
    </style>
  </head>

  <body>
    <h1>Danh sách sinh viên</h1>

    <input id="ten" type="text" placeholder="Nhập tên sinh viên..." />

    <br />

    <button onclick="themCuoi()">Thêm vào cuối</button>
    <button onclick="themDau()">Thêm vào đầu</button>
    <button onclick="xoaCuoi()">Xóa người cuối</button>
    <button onclick="xoaTatCa()">Xóa tất cả</button>

    <div id="ketqua">
      Tổng số:
      <b id="soLuong">0</b>
      sinh viên
      <div id="danhSach"></div>
    </div>

    <script>
        ${function ()
            $("#button").addcss("color", "red");
        }
      let sinhVien = [];
      function hienThi() {
        document.getElementById("soLuong").innerText = sinhVien.length;
        let danhSach = document.getElementById("danhSach");
        danhSach.innerHTML = "";
        for (let i = 0; i < sinhVien.length; i++) {
          danhSach.innerHTML += "<p>" + (i + 1) + ". " + sinhVien[i] + "</p>";
          $("#button").addcss("color", "red");
        }
      }

      function themCuoi() {
        let ten = document.getElementById("ten").value;

        if (ten != "") {
          sinhVien.push(ten);
          document.getElementById("ten").value = "";
          hienThi();
        }
      }

      function themDau() {
        let ten = document.getElementById("ten").value;

        if (ten != "") {
          sinhVien.unshift(ten);
          document.getElementById("ten").value = "";
          hienThi();
        }
      }
      function xoaCuoi() {
        sinhVien.pop();
        hienThi();
      }
      function xoaTatCa() {
        sinhVien = [];
        hienThi();
      }
    </script>
  </body>
</html>
