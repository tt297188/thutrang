<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách đi chợ </title>
</head>
<body>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }
        .container {
            width: 500px;
            margin: 50px auto;
            padding: 25px;
            background-color: white;
            border-radius: 10px;
        }
        h1 {
            text-align: center;
        }
        .input-area {
            display: flex;
            gap: 10px;
        }
        #itemInput {
            flex: 1;
            padding: 10px;
            font-size: 16px;
        }

        #addBtn {
            padding: 10px 20px;
            cursor: pointer;
        }

        #shoppingList {
            padding: 0;
            list-style: none;
        }

        .item {
            padding: 12px;
            margin-top: 8px;
            background-color: #eeeeee;
            border-radius: 5px;
            cursor: pointer;
        }
        .purchased {
            text-decoration: line-through;
            color: gray;
        }

        #count {
            font-weight: bold;
        }

        .note {
            color: gray;
            font-size: 14px;
            line-height: 1.6;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1> Danh sách đi chợ</h1>
        <input id="mon" placeholder="Nhập tên món">
    <button onclick="themMon()">Thêm</button>

    <p id="dem">Còn 0/0 món chưa mua</p>
    <ul id="danhsach"></ul>
    <script>
        // Tạo danh sách món
        let ds = [];
        // Thêm món
        function themMon() {
            let ten = document.getElementById("mon").value.trim();
            // Không cho nhập rỗng
            if (ten == "") {
                return;
            }
            ds.push({
                ten: ten,
                mua: false
            });
            document.getElementById("mon").value = "";
            hienThi();
        }
        // Hiển thị danh sách
        function hienThi() {
            let list = document.getElementById("danhsach");
            list.innerHTML = "";
            for (let i = 0; i < ds.length; i++) {
                let li = document.createElement("li");
                li.innerText = ds[i].ten;

      // Nếu đã mua thì gạch ngang
         if (ds[i].mua) {
          li.classList.add("mua");
             }
      // Bấm 1 lần
         li.onclick = function() {
           ds[i].mua = !ds[i].mua; hienThi();
              };
      // Nháy đúp để xóa
       li.ondblclick = function() {
         ds.splice(i, 1);hienThi();
                };
         list.appendChild(li);
            }
            // Đếm món chưa mua
            let chuaMua = 0;
            for (let i = 0; i < ds.length; i++) {
                if (!ds[i].mua) { chuaMua++;
                }
            }
            document.getElementById("dem").innerText =
                "Còn " + chuaMua + "/" + ds.length + " món chưa mua";
        }
        // Nhấn Enter để thêm
        document.getElementById("mon").onkeydown = function(e) {
            if (e.key == "Enter") {
                themMon();
            }
        };

    </script>
</body>
</html>
