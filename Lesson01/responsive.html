<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive</title>
    <style>
    
      body {
        background-color: burlywood;
        display: flex;
        height: 100vh;
        line-height: 100vh;
      }
      .mobile .tablet .pc {
        color: blue;
        font-size: 100px;
        display: none;
        margin: 0 auto;
      }
       /* pc */
      /* pc width >= 1024 ->min-width */

      @media screen and (min-width: 1024px) {
        .pc {
          display: block;
        }
      }
      /*mobile*/
      /*max-width:739px*/ 

      @media screen and (max-width: 739px) {
        .mobile {
          display: block;
        }
        /*tablet*/
      /*max-width:739px*/ 

      }
      @media screen and (min-width: 740px) and (max-width: 1024px) {
        .tablet {
          display: block;
        }
      }
    </style>
  </head>
  <body>
    <h2 class="mobile"> Mobile </h2>
    <h2 class="tablet"> Tablet </h2>
    <h2 class="pc"> PC </h2>
  </body>
</html>
